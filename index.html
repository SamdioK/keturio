<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0b0d15"
  >

  <meta
    name="description"
    content="Keturio — Connect. Chat. Belong."
  >

  <link
    rel="manifest"
    href="manifest.webmanifest"
  >

  <title>Keturio — Connect. Chat. Belong.</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >
</head>

<body>

  <main
    id="app"
    class="app-shell"
  >

    <!-- =====================================================
         AUTHENTICATION
    ====================================================== -->

    <section
      id="authScreen"
      class="auth-screen"
    >

      <div class="auth-card">

        <div class="logo big">
          K
        </div>

        <h1>Keturio</h1>

        <p>
          Connect. Chat. Belong.
        </p>

        <div class="auth-tabs">

          <button
            id="loginTab"
            class="auth-tab active"
            type="button"
          >
            Login
          </button>

          <button
            id="signupTab"
            class="auth-tab"
            type="button"
          >
            Create account
          </button>

        </div>

        <form id="authForm">

          <label
            id="nameField"
            class="field hidden"
          >

            <span>
              Display name
            </span>

            <input
              id="displayName"
              autocomplete="name"
              maxlength="60"
              placeholder="Your name"
            >

          </label>

          <label class="field">

            <span>
              Email
            </span>

            <input
              id="email"
              type="email"
              autocomplete="email"
              required
              placeholder="you@example.com"
            >

          </label>

          <label class="field">

            <span>
              Password
            </span>

            <input
              id="password"
              type="password"
              autocomplete="current-password"
              minlength="6"
              required
              placeholder="At least 6 characters"
            >

          </label>

          <button
            id="authSubmit"
            class="primary-btn"
            type="submit"
          >
            Login
          </button>

          <p
            id="authMessage"
            class="auth-message"
          ></p>

          <button
            id="resendConfirm"
            class="resend-btn hidden"
            type="button"
          >
            Resend confirmation email
          </button>

        </form>

      </div>

    </section>


    <!-- =====================================================
         MAIN KETURIO CHAT APPLICATION
    ====================================================== -->

    <section
      id="chatApp"
      class="chat-app hidden"
    >

      <!-- ===================================================
           SIDEBAR
      ==================================================== -->

      <aside class="sidebar">

        <header class="brand-row">

          <div class="logo">
            K
          </div>

          <div>
            <strong>
              Keturio
            </strong>

            <span>
              Connect. Chat. Belong.
            </span>
          </div>

          <button
            class="icon-btn"
            id="themeBtn"
            type="button"
            aria-label="Toggle theme"
          >
            ☼
          </button>

        </header>


        <!-- USER PROFILE -->

        <div class="profile-bar">

          <div
            class="avatar gradient"
            id="myAvatar"
          >
            K
          </div>

          <div class="profile-copy">

            <strong id="myName">
              Keturio User
            </strong>

            <span id="myEmail"></span>

          </div>

          <button
            class="icon-btn small"
            id="logoutBtn"
            type="button"
            aria-label="Logout"
          >
            ↪
          </button>

        </div>


        <!-- PEOPLE SEARCH -->

        <div class="search-wrap">

          <input
            id="searchInput"
            type="search"
            placeholder="Search people"
            aria-label="Search people"
          >

        </div>


        <!-- PEOPLE -->

        <div class="section-title">

          <span>
            People
          </span>

          <button
            class="new-chat"
            id="newChatBtn"
            type="button"
            aria-label="New chat"
          >
            ＋
          </button>

        </div>

        <div
          id="chatList"
          class="chat-list"
        ></div>


        <!-- =================================================
             MAIN NAVIGATION
             Stage 3 social.js can also inject its own
             social navigation, but these buttons provide
             a stable main application navigation area.
        ================================================== -->

        <nav class="bottom-nav">

          <button
            class="nav-item active"
            type="button"
            data-nav="chats"
          >
            💬
            <span>
              Chats
            </span>
          </button>

          <button
            class="nav-item"
            type="button"
            data-nav="social"
            id="socialNavBtn"
          >
            🌐
            <span>
              Social
            </span>
          </button>

          <button
            class="nav-item"
            type="button"
            data-nav="settings"
          >
            ⚙
            <span>
              Settings
            </span>
          </button>

        </nav>

      </aside>


      <!-- ===================================================
           CHAT CONVERSATION
      ==================================================== -->

      <section class="conversation">

        <header class="conversation-head">

          <button
            class="back-btn"
            id="backBtn"
            type="button"
            aria-label="Back"
          >
            ‹
          </button>

          <div
            class="avatar gradient"
            id="personAvatar"
          >
            K
          </div>

          <div class="person">

            <strong id="personName">
              Select a chat
            </strong>

            <span id="presence">
              Choose a person
            </span>

          </div>

          <div class="head-actions">

            <button
              class="icon-btn"
              type="button"
              aria-label="Search"
            >
              ⌕
            </button>

            <button
              class="icon-btn"
              type="button"
              aria-label="More"
            >
              ⋮
            </button>

          </div>

        </header>


        <!-- CHAT WALL -->

        <div
          class="chat-wall"
          id="chatWall"
        >

          <div class="empty-chat">

            <div class="spark">
              ✦
            </div>

            <h2>
              Your Keturio chat
            </h2>

            <p>
              Choose a person to start a real-time conversation.
            </p>

          </div>

        </div>


        <!-- MESSAGE COMPOSER -->

        <form
          class="composer"
          id="composer"
        >

          <button
            type="button"
            class="attach"
            id="emojiBtn"
            aria-label="Add emoji"
          >
            ☺
          </button>

          <input
            id="messageInput"
            autocomplete="off"
            maxlength="2000"
            placeholder="Write a message…"
            aria-label="Message"
          >

          <button
            type="submit"
            class="send-btn"
            aria-label="Send"
          >
            ➤
          </button>

        </form>


        <div class="data-note">
          ⚡ Data Saver is on · realtime text + typing use very little data
        </div>

      </section>

    </section>

  </main>


  <!-- =====================================================
       GLOBAL TOAST
  ====================================================== -->

  <div
    id="toast"
    class="toast"
    role="status"
  ></div>


  <!-- =====================================================
       KETURIO CONFIG
       Keep your existing config.js.
  ====================================================== -->

  <script src="config.js"></script>


  <!-- =====================================================
       ORIGINAL KETURIO CHAT ENGINE
       DO NOT REMOVE THIS.
  ====================================================== -->

  <script
    type="module"
    src="app.js"
  ></script>


  <!-- =====================================================
       KETURIO STAGE 3 SOCIAL ENGINE

       This loads:
       • Feed
       • People discovery
       • @username / Keturio ID
       • Follow / Connect
       • Posts
       • Reactions
       • Moments
       • My Profile
       ====================================================== -->

  <script
    type="module"
    src="social.js"
  ></script>


  <!-- =====================================================
       OPTIONAL SOCIAL NAVIGATION HANDLER

       This safely opens the Stage 3 social interface when
       the Social button is clicked.
  ====================================================== -->

  <script type="module">

    const socialButton =
      document.getElementById("socialNavBtn");

    if (socialButton) {

      socialButton.addEventListener("click", () => {

        /*
         * social.js exposes the social interface through
         * its own UI. Dispatching this event allows the
         * social module to respond without modifying the
         * original chat engine.
         */

        window.dispatchEvent(
          new CustomEvent("keturio:open-social")
        );

      });

    }

  </script>

</body>
</html>
