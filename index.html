
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d15">
  <meta name="description" content="Keturio — Connect. Chat. Belong.">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Keturio — Connect. Chat. Belong.</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main id="app" class="app-shell">

    <!-- LOGIN AND SIGNUP -->
    <section id="authScreen" class="auth-screen">
      <div class="auth-card">

        <!-- KETURIO ANIMATED LOGO -->
        <div class="logo big keturio-mark" aria-label="Keturio logo">
          <svg viewBox="0 0 100 100" role="img" aria-hidden="true">
            <defs>
              <linearGradient id="keturioViolet" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#d18aff"/>
                <stop offset=".55" stop-color="#7858ff"/>
                <stop offset="1" stop-color="#168cff"/>
              </linearGradient>

              <linearGradient id="keturioBlue" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#8d7bff"/>
                <stop offset="1" stop-color="#13baff"/>
              </linearGradient>

              <linearGradient id="keturioTeal" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#12c9ff"/>
                <stop offset="1" stop-color="#35f0b8"/>
              </linearGradient>
            </defs>

            <path class="mark-piece mark-spine"
              d="M24 18 Q24 12 31 12 L39 12 Q44 12 44 19 L44 75 Q44 88 29 94 Q24 96 24 89 Z"
              fill="url(#keturioBlue)"/>

            <path class="mark-piece mark-top"
              d="M49 43 L70 17 Q75 11 83 11 L91 11 Q95 11 91 16 L65 44 Q58 49 49 49 Z"
              fill="url(#keturioViolet)"/>

            <path class="mark-piece mark-bottom"
              d="M49 53 Q59 51 66 58 L92 86 Q96 92 88 92 L78 92 Q72 92 67 87 L49 65 Z"
              fill="url(#keturioTeal)"/>
          </svg>
        </div>

        <h1>Keturio</h1>
        <p>Connect. Chat. Belong.</p>

        <div class="auth-tabs">
          <button id="loginTab" class="auth-tab active" type="button">
            Login
          </button>

          <button id="signupTab" class="auth-tab" type="button">
            Create account
          </button>
        </div>

        <form id="authForm">
          <label id="nameField" class="field hidden">
            <span>Display name</span>
            <input
              id="displayName"
              autocomplete="name"
              maxlength="60"
              placeholder="Your name">
          </label>

          <label class="field">
            <span>Email</span>
            <input
              id="email"
              type="email"
              autocomplete="email"
              required
              placeholder="you@example.com">
          </label>

          <label class="field">
            <span>Password</span>
            <input
              id="password"
              type="password"
              autocomplete="current-password"
              minlength="6"
              required
              placeholder="At least 6 characters">
          </label>

          <button id="authSubmit" class="primary-btn" type="submit">
            Login
          </button>

          <p id="authMessage" class="auth-message"></p>

          <button id="resendConfirm" class="resend-btn hidden" type="button">
            Resend confirmation email
          </button>
        </form>
      </div>
    </section>

    <!-- CHAT APPLICATION -->
    <section id="chatApp" class="chat-app hidden">

      <!-- SIDEBAR -->
      <aside class="sidebar">

        <header class="brand-row">

          <!-- KETURIO BRAND ICON -->
          <div class="logo keturio-mark" aria-label="Keturio logo">
            <svg viewBox="0 0 100 100" aria-hidden="true">
              <defs>
                <linearGradient id="brandBlue" x1="0" y1="0" x2="1" y2="1">
                  <stop stop-color="#9b8aff"/>
                  <stop offset="1" stop-color="#168cff"/>
                </linearGradient>

                <linearGradient id="brandViolet" x1="0" y1="0" x2="1" y2="1">
                  <stop stop-color="#d18aff"/>
                  <stop offset="1" stop-color="#6255ff"/>
                </linearGradient>

                <linearGradient id="brandTeal" x1="0" y1="0" x2="1" y2="1">
                  <stop stop-color="#12c9ff"/>
                  <stop offset="1" stop-color="#35f0b8"/>
                </linearGradient>
              </defs>

              <path
                d="M24 18 Q24 12 31 12 L39 12 Q44 12 44 19 L44 75 Q44 88 29 94 Q24 96 24 89 Z"
                fill="url(#brandBlue)"/>

              <path
                d="M49 43 L70 17 Q75 11 83 11 L91 11 Q95 11 91 16 L65 44 Q58 49 49 49 Z"
                fill="url(#brandViolet)"/>

              <path
                d="M49 53 Q59 51 66 58 L92 86 Q96 92 88 92 L78 92 Q72 92 67 87 L49 65 Z"
                fill="url(#brandTeal)"/>
            </svg>
          </div>

          <div>
            <strong>Keturio</strong>
            <span>Connect. Chat. Belong.</span>
          </div>

          <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">
            ☼
          </button>
        </header>

        <!-- CURRENT USER -->
        <div class="profile-bar">
          <div class="avatar gradient" id="myAvatar">K</div>

          <div class="profile-copy">
            <strong id="myName">Keturio User</strong>
            <span id="myEmail"></span>
          </div>

          <button class="icon-btn small" id="logoutBtn" aria-label="Logout">
            ↪
          </button>
        </div>

        <!-- PEOPLE SEARCH -->
        <div class="search-wrap">
          <input
            id="searchInput"
            type="search"
            placeholder="Search people"
            aria-label="Search people">
        </div>

        <div class="section-title">
          <span>People</span>
          <button class="new-chat" id="newChatBtn" type="button">＋</button>
        </div>

        <div id="chatList" class="chat-list"></div>

        <!-- NAVIGATION -->
        <nav class="bottom-nav">
          <button class="nav-item active" type="button">
            💬
            <span>Chats</span>
          </button>

          <button class="nav-item" type="button">
            ☎
            <span>Calls</span>
          </button>

          <button class="nav-item" type="button">
            ⚙
            <span>Settings</span>
          </button>

          <button
            class="nav-item"
            id="openSocialBtn"
            type="button"
            aria-label="Open Keturio Social">
            🌐
            <span>Social</span>
          </button>
        </nav>
      </aside>

      <!-- CONVERSATION PANEL -->
      <section class="conversation">

        <header class="conversation-head">
          <button class="back-btn" id="backBtn" aria-label="Back">
            ‹
          </button>

          <div class="avatar gradient" id="personAvatar">K</div>

          <div class="person">
            <strong id="personName">Select a chat</strong>
            <span id="presence">Choose a person</span>
          </div>

          <div class="head-actions">
            <button class="icon-btn" type="button" aria-label="Search">
              ⌕
            </button>

            <button class="icon-btn" type="button" aria-label="More options">
              ⋮
            </button>
          </div>
        </header>

        <div class="chat-wall" id="chatWall">
          <div class="empty-chat">
            <div class="spark">✦</div>
            <h2>Your Keturio chat</h2>
            <p>Choose a person to start a real-time conversation.</p>
          </div>
        </div>

        <!-- MESSAGE COMPOSER -->
        <form class="composer" id="composer">
          <button
            type="button"
            class="attach"
            id="emojiBtn"
            aria-label="Add emoji">
            ☺
          </button>

          <input
            id="messageInput"
            autocomplete="off"
            maxlength="2000"
            placeholder="Write a message…"
            aria-label="Message">

          <button type="submit" class="send-btn" aria-label="Send">
            ➤
          </button>
        </form>

        <div class="data-note">
          ⚡ Data Saver is on · realtime text + typing use very little data
        </div>
      </section>
    </section>
  </main>

  <!-- STATUS MESSAGE -->
  <div id="toast" class="toast" role="status"></div>

  <!-- APPLICATION SCRIPTS -->
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
  <script type="module" src="social.js"></script>

  <script>
    document.getElementById("openSocialBtn")?.addEventListener(
      "click",
      () => {
        window.dispatchEvent(
          new CustomEvent("keturio:open-social")
        );
      }
    );
  </script>
</body>
</html>
