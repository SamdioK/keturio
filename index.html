<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d15"><meta name="description" content="Keturio — Connect. Chat. Belong."><link rel="manifest" href="manifest.webmanifest"><title>Keturio — Connect. Chat. Belong.</title><link rel="stylesheet" href="styles.css"></head><body><main id="app" class="app-shell"><section id="authScreen" class="auth-screen"><div class="auth-card"><div class="logo big">K</div><h1>Keturio</h1><p>Connect. Chat. Belong.</p><div class="auth-tabs"><button id="loginTab" class="auth-tab active">Login</button><button id="signupTab" class="auth-tab">Create account</button></div><form id="authForm"><label id="nameField" class="field hidden"><span>Display name</span><input id="displayName" autocomplete="name" maxlength="60" placeholder="Your name"></label><label class="field"><span>Email</span><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label class="field"><span>Password</span><input id="password" type="password" autocomplete="current-password" minlength="6" required placeholder="At least 6 characters"></label><button id="authSubmit" class="primary-btn" type="submit">Login</button><p id="authMessage" class="auth-message"></p><button id="resendConfirm" class="resend-btn hidden" type="button">Resend confirmation email</button></form></div></section><section id="chatApp" class="chat-app hidden"><aside class="sidebar"><header class="brand-row"><div class="logo">K</div><div><strong>Keturio</strong><span>Connect. Chat. Belong.</span></div><button class="icon-btn" id="themeBtn" aria-label="Toggle theme">☼</button></header><div class="profile-bar"><div class="avatar gradient" id="myAvatar">K</div><div class="profile-copy"><strong id="myName">Keturio User</strong><span id="myEmail"></span></div><button class="icon-btn small" id="logoutBtn" aria-label="Logout">↪</button></div><div class="search-wrap"><input id="searchInput" type="search" placeholder="Search people or chats" aria-label="Search people or chats"></div><div class="section-title"><span id="chatListTitle">Recent Chats</span><button class="new-chat" id="newChatBtn">＋</button></div><div id="chatList" class="chat-list"></div><nav class="bottom-nav"><button class="nav-item active" type="button">💬<span>Chats</span></button><button class="nav-item" type="button">☎<span>Calls</span></button><button class="nav-item" type="button">⚙<span>Settings</span></button><button class="nav-item" id="openSocialBtn" type="button" aria-label="Open Keturio Social">🌐<span>Social</span></button></nav></aside><section class="conversation"><header class="conversation-head"><button class="back-btn" id="backBtn" aria-label="Back">‹</button><div class="avatar gradient" id="personAvatar">K</div><div class="person"><strong id="personName">Select a chat</strong><span id="presence">Choose a person</span></div><div class="head-actions"><button class="icon-btn" aria-label="Search">⌕</button><button class="icon-btn" aria-label="More">⋮</button></div></header><div class="chat-wall" id="chatWall"><div class="empty-chat"><div class="spark">✦</div><h2>Your Keturio chat</h2><p>Choose a person to start a real-time conversation.</p></div></div><form class="composer" id="composer"><button type="button" class="attach" id="emojiBtn" aria-label="Add emoji">☺</button><input id="messageInput" autocomplete="off" maxlength="2000" placeholder="Write a message…" aria-label="Message"><button type="submit" class="send-btn" aria-label="Send">➤</button></form><div class="data-note">⚡ Data Saver is on · realtime text + typing use very little data</div></section></section></main><div id="toast" class="toast" role="status"></div><script src="config.js"></script><script type="module" src="app.js"></script><script type="module" src="social.js"></script><script>document.getElementById("openSocialBtn")?.addEventListener("click",()=>window.dispatchEvent(new CustomEvent("keturio:open-social")));</script></body></html>
